<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 250" width="100%" height="100%" style="background: transparent;">
  <defs>
    <!-- Monochromatic Gradients -->
    <linearGradient id="installMonoBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090A0F" />
      <stop offset="100%" stop-color="#030407" />
    </linearGradient>

    <linearGradient id="installCardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141721" />
      <stop offset="100%" stop-color="#0B0D13" />
    </linearGradient>

    <linearGradient id="monoProgress" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#52525B" />
      <stop offset="50%" stop-color="#A1A1AA" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Keyframe Animations (Strictly Monochromatic, Non-Shifting: ZERO scale, ZERO translate) -->
    <style>
      @keyframes blinkCursor {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes flowProgress {
        0% { width: 0; }
        35% { width: 140px; }
        70% { width: 340px; }
        100% { width: 520px; }
      }
      @keyframes staticPulse {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }

      .terminal-cursor { animation: blinkCursor 0.9s infinite; }
      .progress-bar-fill { animation: flowProgress 3.5s linear infinite; }
      .step-active { animation: staticPulse 3s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Container Box (Square corners rx=3) -->
  <rect x="2" y="2" width="846" height="246" rx="3" fill="url(#installMonoBg)" stroke="#27272A" stroke-width="1" />

  <!-- Section Title -->
  <g transform="translate(425, 34)" text-anchor="middle">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace, sans-serif" font-weight="700" font-size="14" fill="#FFFFFF" letter-spacing="1">
      ONE-COMMAND SETUP // HUMAN &amp; AI AGENT DEPLOYMENT
    </text>
    <text y="18" font-family="monospace" font-size="10.5" fill="#71717A" letter-spacing="0.5">
      ZERO-CONFIG • NATIVE CPU EXECUTION • MACOS (ARM64) &amp; WINDOWS (X86_64)
    </text>
  </g>

  <!-- Simulated Monochromatic Terminal Box -->
  <g transform="translate(165, 68)">
    <rect width="520" height="48" rx="2" fill="#000000" stroke="#3F3F46" stroke-width="1" />
    
    <!-- Window Indicators (Square) -->
    <rect x="14" y="14" width="6" height="6" fill="#71717A" />
    <rect x="25" y="14" width="6" height="6" fill="#52525B" />
    <rect x="36" y="14" width="6" height="6" fill="#3F3F46" />
    <text x="52" y="20" font-family="monospace" font-size="9.5" fill="#52525B">terminal.exe</text>

    <!-- Command Prompt Line -->
    <text x="14" y="37" font-family="monospace" font-size="12" font-weight="700" fill="#A1A1AA">$</text>
    <text x="28" y="37" font-family="monospace" font-size="11.5" fill="#F4F4F5">curl -fsSL https://git.new/omnicontrol | bash</text>
    <rect x="350" y="27" width="7" height="12" fill="#FFFFFF" class="terminal-cursor" />
  </g>

  <!-- Static Progress Track with Smooth Monochromatic Flow -->
  <g transform="translate(165, 126)">
    <rect width="520" height="4" rx="1" fill="#18181B" />
    <rect height="4" rx="1" fill="url(#monoProgress)" class="progress-bar-fill" />
  </g>

  <!-- 3-Step Execution Pipeline Cards (Square corners rx=2, Perfectly static coordinates) -->
  <g transform="translate(90, 146)">
    <!-- Step 1: Download & Unpack -->
    <g transform="translate(0, 0)">
      <rect width="200" height="74" rx="2" fill="url(#installCardBg)" stroke="#3F3F46" stroke-width="1" />
      <rect x="12" y="12" width="16" height="16" rx="1" fill="#18181B" stroke="#3F3F46" />
      <text x="20" y="24" text-anchor="middle" font-family="monospace" font-weight="700" font-size="10" fill="#A1A1AA">01</text>
      <text x="36" y="24" font-family="monospace" font-weight="700" font-size="11" fill="#FFFFFF">AUTO_UNPACK</text>
      <text x="14" y="44" font-family="monospace" font-size="10" fill="#A1A1AA">Model size: 35.3 MB</text>
      <text x="14" y="58" font-family="monospace" font-size="10" fill="#71717A">Zero heavy downloads</text>
    </g>

    <!-- Static Connector Line -->
    <line x1="205" y1="37" x2="230" y2="37" stroke="#3F3F46" stroke-width="1" />

    <!-- Step 2: System Binding -->
    <g transform="translate(235, 0)">
      <rect width="200" height="74" rx="2" fill="url(#installCardBg)" stroke="#3F3F46" stroke-width="1" />
      <rect x="12" y="12" width="16" height="16" rx="1" fill="#18181B" stroke="#3F3F46" />
      <text x="20" y="24" text-anchor="middle" font-family="monospace" font-weight="700" font-size="10" fill="#A1A1AA">02</text>
      <text x="36" y="24" font-family="monospace" font-weight="700" font-size="11" fill="#FFFFFF">SYSTEM_BIND</text>
      <text x="14" y="44" font-family="monospace" font-size="10" fill="#A1A1AA">Spotlight &amp; Everything</text>
      <text x="14" y="58" font-family="monospace" font-size="10" fill="#71717A">AppleScript / Win32 API</text>
    </g>

    <!-- Static Connector Line -->
    <line x1="440" y1="37" x2="465" y2="37" stroke="#3F3F46" stroke-width="1" />

    <!-- Step 3: Verified Ready -->
    <g transform="translate(470, 0)">
      <rect width="200" height="74" rx="2" fill="#18181B" stroke="#71717A" stroke-width="1" class="step-active" />
      <rect x="12" y="12" width="16" height="16" rx="1" fill="#27272A" stroke="#71717A" />
      <text x="20" y="24" text-anchor="middle" font-family="monospace" font-weight="700" font-size="10" fill="#FFFFFF">03</text>
      <text x="36" y="24" font-family="monospace" font-weight="700" font-size="11" fill="#FFFFFF">VERIFIED_READY</text>
      <text x="14" y="44" font-family="monospace" font-size="10" fill="#E4E4E7">Latency: &lt; 28 ms</text>
      <text x="14" y="58" font-family="monospace" font-size="10" fill="#A1A1AA">100% Offline execution</text>
    </g>
  </g>
</svg>
