<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 360" width="100%" height="100%" style="background: transparent;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C16" />
      <stop offset="50%" stop-color="#0E1626" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Keyframe Animations -->
    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.02); }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -40; }
      }
      @keyframes floatNode {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }
      @keyframes signalTravel {
        0% { cx: 210; cy: 220; opacity: 0; }
        15% { opacity: 1; }
        45% { cx: 425; cy: 220; }
        85% { opacity: 1; }
        100% { cx: 640; cy: 220; opacity: 0; }
      }
      @keyframes badgePulse {
        0%, 100% { opacity: 0.85; }
        50% { opacity: 1; filter: drop-shadow(0 0 6px #38BDF8); }
      }

      .bg-grid { stroke: #1E293B; stroke-opacity: 0.35; stroke-width: 1; }
      .glowing-border {
        animation: pulseGlow 4s ease-in-out infinite;
        transform-origin: center;
      }
      .flow-line {
        stroke-dasharray: 6 4;
        animation: dashFlow 1.2s linear infinite;
      }
      .node-mac { animation: floatNode 3.5s ease-in-out infinite; }
      .node-win { animation: floatNode 3.5s ease-in-out infinite 0.8s; }
      .node-core { animation: floatNode 3.5s ease-in-out infinite 0.4s; }
      .badge-anim { animation: badgePulse 2.5s ease-in-out infinite; }
      .signal-dot { animation: signalTravel 2s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Outer Canvas Container -->
  <rect x="2" y="2" width="846" height="356" rx="20" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" />

  <!-- Subtle Matrix Grid -->
  <g class="bg-grid">
    <line x1="50" y1="0" x2="50" y2="360" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="250" y1="0" x2="250" y2="360" />
    <line x1="350" y1="0" x2="350" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="550" y1="0" x2="550" y2="360" />
    <line x1="650" y1="0" x2="650" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="0" y1="60" x2="850" y2="60" />
    <line x1="0" y1="120" x2="850" y2="120" />
    <line x1="0" y1="180" x2="850" y2="180" />
    <line x1="0" y1="240" x2="850" y2="240" />
    <line x1="0" y1="300" x2="850" y2="300" />
  </g>

  <!-- Ambient Light Halo -->
  <circle cx="425" cy="180" r="180" fill="#6366F1" opacity="0.08" filter="url(#glow)" />
  <circle cx="425" cy="220" r="90" fill="#38BDF8" opacity="0.12" filter="url(#glow)" />

  <!-- Title & Subtitle Banner -->
  <g transform="translate(425, 55)" text-anchor="middle">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="34" letter-spacing="1.5" fill="url(#accentGrad)">
      OMNICONTROL PC
    </text>
    <text y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="13.5" fill="#94A3B8" letter-spacing="0.5">
      Ultralight (~35MB) On-Device System Assistant &amp; Tool Engine for macOS &amp; Windows
    </text>
  </g>

  <!-- Animated Connection Bus Lines -->
  <g>
    <!-- Left to Center -->
    <path d="M 210 220 L 425 220" stroke="#38BDF8" stroke-width="2.5" fill="none" class="flow-line" opacity="0.8" />
    <!-- Center to Right -->
    <path d="M 425 220 L 640 220" stroke="#818CF8" stroke-width="2.5" fill="none" class="flow-line" opacity="0.8" />
    
    <!-- Moving Signal Pulse -->
    <circle r="4.5" fill="#38BDF8" filter="url(#glow)" class="signal-dot" />
  </g>

  <!-- LEFT NODE: User Query (Voice/Text) -->
  <g class="node-mac" transform="translate(110, 165)">
    <rect width="180" height="110" rx="14" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.2" filter="url(#cardShadow)" />
    <!-- Header Dot -->
    <circle cx="20" cy="22" r="5" fill="#38BDF8" />
    <text x="32" y="26" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" fill="#E2E8F0">ENTRADA NATURAL</text>
    <text x="16" y="52" font-family="'Segoe UI', Roboto, monospace" font-size="11" fill="#38BDF8">"sube el volumen 50%"</text>
    <text x="16" y="70" font-family="'Segoe UI', Roboto, monospace" font-size="11" fill="#38BDF8">"busca apuntes SO"</text>
    <text x="16" y="88" font-family="'Segoe UI', Roboto, monospace" font-size="11" fill="#38BDF8">"abre el campus UAB"</text>
  </g>

  <!-- CENTER NODE: Needle 3 SAN Core Engine -->
  <g class="node-core" transform="translate(330, 150)">
    <rect width="190" height="135" rx="16" fill="#0B132B" stroke="#6366F1" stroke-width="1.8" filter="url(#cardShadow)" />
    <!-- Pulse Effect -->
    <rect x="-3" y="-3" width="196" height="141" rx="18" fill="none" stroke="#818CF8" stroke-width="1.2" opacity="0.4" class="glowing-border" />
    
    <text x="95" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="800" font-size="13.5" fill="#F8FAFC">
      NEEDLE 3 ENGINE
    </text>
    
    <line x1="20" y1="38" x2="170" y2="38" stroke="#1E293B" stroke-width="1" />
    
    <text x="95" y="60" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11.5" fill="#38BDF8">
      LoRA Spanish Weights
    </text>
    <text x="95" y="80" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94A3B8">
      CQ W4 STE Quantized
    </text>
    <text x="95" y="100" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11.5" fill="#A855F7">
      Footprint: 35.3 MB
    </text>
    <text x="95" y="118" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#10B981">
      ⚡ Latencia: &lt; 28 ms
    </text>
  </g>

  <!-- RIGHT NODE: Dual OS Execution -->
  <g class="node-win" transform="translate(560, 165)">
    <rect width="180" height="110" rx="14" fill="url(#cardGrad)" stroke="#A855F7" stroke-width="1.2" filter="url(#cardShadow)" />
    <!-- OS Tag -->
    <circle cx="20" cy="22" r="5" fill="#A855F7" />
    <text x="32" y="26" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" fill="#E2E8F0">ACCIONES NATIVAS</text>
    
    <!-- macOS row -->
    <text x="16" y="52" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11" fill="#E2E8F0">🍎 macOS (Apple Silicon)</text>
    <text x="24" y="68" font-family="'Segoe UI', Roboto, monospace" font-size="10" fill="#94A3B8">Spotlight &amp; AppleScript</text>
    
    <!-- Windows row -->
    <text x="16" y="88" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11" fill="#E2E8F0">🪟 Windows (x64 / i3+)</text>
    <text x="24" y="102" font-family="'Segoe UI', Roboto, monospace" font-size="10" fill="#94A3B8">Everything CLI &amp; Win32</text>
  </g>

  <!-- Bottom Metric Badges -->
  <g transform="translate(125, 315)">
    <!-- Badge 1: 0 Cloud Costs -->
    <rect x="0" y="0" width="130" height="26" rx="13" fill="#1E293B" stroke="#334155" />
    <text x="65" y="17" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#38BDF8">🔒 100% Offline</text>

    <!-- Badge 2: RAM Footprint -->
    <rect x="145" y="0" width="145" height="26" rx="13" fill="#1E293B" stroke="#334155" />
    <text x="217" y="17" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#A855F7">🧠 RAM: ~94 MB</text>

    <!-- Badge 3: Hardware Friendly -->
    <rect x="305" y="0" width="155" height="26" rx="13" fill="#1E293B" stroke="#334155" />
    <text x="382" y="17" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#10B981">💻 Corre en i3 7ma Gen</text>

    <!-- Badge 4: License -->
    <rect x="475" y="0" width="125" height="26" rx="13" fill="#1E293B" stroke="#334155" class="badge-anim" />
    <text x="537" y="17" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#FBBF24">📜 Apache-2.0</text>
  </g>
</svg>
