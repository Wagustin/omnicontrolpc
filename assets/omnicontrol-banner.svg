<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 320" width="100%" height="100%" style="background: transparent;">
  <defs>
    <!-- Monochromatic Gradients -->
    <linearGradient id="monoBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090A0F" />
      <stop offset="100%" stop-color="#030407" />
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141721" />
      <stop offset="100%" stop-color="#0B0D13" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#A1A1AA" />
    </linearGradient>

    <!-- Keyframe Animations (Strictly Monochromatic & Non-Shifting: ZERO scale, ZERO translate) -->
    <style>
      @keyframes dashFlow {
        to { stroke-dashoffset: -20; }
      }
      @keyframes subtlePulse {
        0%, 100% { opacity: 0.55; }
        50% { opacity: 0.95; }
      }
      @keyframes signalTravel {
        0% { cx: 220; opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { cx: 630; opacity: 0; }
      }

      .line-flow {
        stroke-dasharray: 4 4;
        animation: dashFlow 1.2s linear infinite;
      }
      .node-pulse {
        animation: subtlePulse 3s ease-in-out infinite;
      }
      .signal-point {
        animation: signalTravel 2.4s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Base Canvas Frame (Square/Rectangular Technical aesthetic rx=3) -->
  <rect x="2" y="2" width="846" height="316" rx="3" fill="url(#monoBg)" stroke="#27272A" stroke-width="1" />

  <!-- Technical Grid Pattern -->
  <g stroke="#18181B" stroke-width="1">
    <line x1="70" y1="0" x2="70" y2="320" />
    <line x1="210" y1="0" x2="210" y2="320" />
    <line x1="350" y1="0" x2="350" y2="320" />
    <line x1="490" y1="0" x2="490" y2="320" />
    <line x1="630" y1="0" x2="630" y2="320" />
    <line x1="770" y1="0" x2="770" y2="320" />
    <line x1="0" y1="50" x2="850" y2="50" />
    <line x1="0" y1="120" x2="850" y2="120" />
    <line x1="0" y1="255" x2="850" y2="255" />
  </g>

  <!-- Technical Top Header Bar -->
  <g transform="translate(30, 32)">
    <rect x="0" y="0" width="8" height="8" fill="#FFFFFF" />
    <text x="18" y="8" font-family="monospace" font-size="11" fill="#71717A" letter-spacing="1.5">SYS.SPEC // LOCAL_ON_DEVICE_RUNTIME</text>
    <text x="790" y="8" text-anchor="end" font-family="monospace" font-size="11" fill="#71717A">v1.0.0-PROD</text>
  </g>

  <!-- Main Hero Title -->
  <g transform="translate(425, 88)" text-anchor="middle">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="28" letter-spacing="2" fill="url(#textGrad)">
      OMNICONTROL PC
    </text>
    <text y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="12" fill="#A1A1AA" letter-spacing="0.8">
      100% OFFLINE • APACHE-2.0 • ON-DEVICE SYSTEM ASSISTANT &amp; TOOL ENGINE
    </text>
  </g>

  <!-- Flow Connector Line -->
  <line x1="220" y1="190" x2="630" y2="190" stroke="#3F3F46" stroke-width="1.5" class="line-flow" />
  <!-- Signal Packet Traveling -->
  <circle cy="190" r="3" fill="#FFFFFF" class="signal-point" />

  <!-- Block 1: Voice & Natural Input (Square Corners rx=3) -->
  <g transform="translate(90, 145)">
    <rect width="170" height="90" rx="3" fill="url(#cardBg)" stroke="#3F3F46" stroke-width="1" />
    <rect x="12" y="14" width="6" height="6" fill="#A1A1AA" />
    <text x="26" y="21" font-family="monospace" font-size="11" font-weight="700" fill="#E4E4E7">INPUT_SPEECH</text>
    <text x="14" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#A1A1AA">Español Natural</text>
    <text x="14" y="60" font-family="monospace" font-size="10" fill="#71717A">"sube el volumen"</text>
    <text x="14" y="74" font-family="monospace" font-size="10" fill="#71717A">"busca apuntes SO"</text>
  </g>

  <!-- Block 2: Needle 3 SAN Core (Square Corners rx=3) -->
  <g transform="translate(340, 135)">
    <rect width="170" height="110" rx="3" fill="#18181B" stroke="#71717A" stroke-width="1" class="node-pulse" />
    <rect x="12" y="14" width="6" height="6" fill="#FFFFFF" />
    <text x="26" y="21" font-family="monospace" font-size="11" font-weight="700" fill="#FFFFFF">NEEDLE 3 CORE</text>
    <text x="14" y="46" font-family="monospace" font-size="10.5" fill="#E4E4E7">Simple Attention</text>
    <text x="14" y="64" font-family="monospace" font-size="10" fill="#A1A1AA">Quant: W4 CQ + A8</text>
    <text x="14" y="82" font-family="monospace" font-size="10" fill="#A1A1AA">Weights: ~35.3 MB</text>
    <text x="14" y="98" font-family="monospace" font-size="10" fill="#FFFFFF">RAM: ~94 MB</text>
  </g>

  <!-- Block 3: Operating System Hooks (Square Corners rx=3) -->
  <g transform="translate(590, 145)">
    <rect width="170" height="90" rx="3" fill="url(#cardBg)" stroke="#3F3F46" stroke-width="1" />
    <rect x="12" y="14" width="6" height="6" fill="#A1A1AA" />
    <text x="26" y="21" font-family="monospace" font-size="11" font-weight="700" fill="#E4E4E7">NATIVE_SYSTEM</text>
    <text x="14" y="44" font-family="monospace" font-size="10.5" fill="#A1A1AA">macOS (ARM64)</text>
    <text x="14" y="58" font-family="monospace" font-size="10" fill="#71717A">Spotlight / AppleScript</text>
    <text x="14" y="74" font-family="monospace" font-size="10.5" fill="#A1A1AA">Windows (x86_64)</text>
    <text x="14" y="86" font-family="monospace" font-size="10" fill="#71717A">Everything / Win32</text>
  </g>

  <!-- Technical Telemetry Footer (Sharp Square Indicators) -->
  <g transform="translate(90, 275)">
    <!-- Metric 1 -->
    <rect x="0" y="0" width="150" height="26" rx="2" fill="#12141C" stroke="#27272A" stroke-width="1" />
    <text x="10" y="17" font-family="monospace" font-size="10" fill="#71717A">LATENCY</text>
    <text x="140" y="17" text-anchor="end" font-family="monospace" font-size="10" font-weight="700" fill="#E4E4E7">&lt; 28 ms</text>

    <!-- Metric 2 -->
    <rect x="170" y="0" width="150" height="26" rx="2" fill="#12141C" stroke="#27272A" stroke-width="1" />
    <text x="180" y="17" font-family="monospace" font-size="10" fill="#71717A">FOOTPRINT</text>
    <text x="310" y="17" text-anchor="end" font-family="monospace" font-size="10" font-weight="700" fill="#E4E4E7">35.3 MB</text>

    <!-- Metric 3 -->
    <rect x="340" y="0" width="150" height="26" rx="2" fill="#12141C" stroke="#27272A" stroke-width="1" />
    <text x="350" y="17" font-family="monospace" font-size="10" fill="#71717A">MEMORY</text>
    <text x="480" y="17" text-anchor="end" font-family="monospace" font-size="10" font-weight="700" fill="#E4E4E7">~94 MB RAM</text>

    <!-- Metric 4 -->
    <rect x="510" y="0" width="160" height="26" rx="2" fill="#12141C" stroke="#27272A" stroke-width="1" />
    <text x="520" y="17" font-family="monospace" font-size="10" fill="#71717A">LICENSE</text>
    <text x="660" y="17" text-anchor="end" font-family="monospace" font-size="10" font-weight="700" fill="#FFFFFF">Apache-2.0</text>
  </g>
</svg>
